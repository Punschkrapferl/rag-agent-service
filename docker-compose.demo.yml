services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage_demo:/qdrant/storage

  rag-api:
    image: punschkrapferl23/rag-agent-service-api:v1.0.2
    depends_on:
      - qdrant
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ENVIRONMENT=demo
    ports:
      - "8000:8000"

volumes:
  qdrant_storage_demo:
