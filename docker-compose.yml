services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  rag-api:
    image: punschkrapferl23/rag-agent-service-api:latest
    depends_on:
      - qdrant
    ports:
      - "8000:8000"

  automation-gateway:
    image: punschkrapferl23/automation-gateway:latest
    depends_on:
      - rag-api
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AI_SERVICE_BASE_URL=http://rag-api:8000
    ports:
      - "8080:8080"

volumes:
  qdrant_storage:
